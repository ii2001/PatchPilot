[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot"
version = "0.1.0"
description = "A mock-first LangGraph CI repair agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
